[workspace]
members = ["crates/ruckus-core", "crates/ruckus-daemon", "crates/ruckus-tui"]
exclude = ["vendor/vt100"]

[workspace.package]
version = "0.3.2"
edition = "2021"
license = "Apache-2.0"

[workspace.dependencies]
anyhow = "1"
base64 = "0.22"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
clap = { version = "4", features = ["derive"] }
crossterm = "0.28"
dirs = "5"
libc = "0.2"
portable-pty = "0.8"
ratatui = "0.29"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
toml = "0.8"
toml_edit = "0.22"
tracing = "0.1"
tracing-subscriber = "0.3"
vt100 = { path = "vendor/vt100" }

[package]
name = "ruckus"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "a persistent runtime for your coding agents"

[dependencies]
ruckus-core = { path = "crates/ruckus-core" }
ruckus-daemon = { path = "crates/ruckus-daemon" }
ruckus-tui = { path = "crates/ruckus-tui" }
anyhow.workspace = true
base64.workspace = true
chrono.workspace = true
crossterm.workspace = true
libc.workspace = true
clap.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
toml.workspace = true
toml_edit.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[profile.release]
lto = true
strip = true

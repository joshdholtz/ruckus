[package]
name = "ruckus"
version = "0.1.0"
edition = "2021"
description = "a persistent runtime for your coding agents"
license = "Apache-2.0"

[dependencies]
anyhow = "1"
base64 = "0.22"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
clap = { version = "4", features = ["derive"] }
crossterm = "0.28"
dirs = "5"
libc = "0.2"
portable-pty = "0.8"
ratatui = "0.29"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
toml = "0.8"
toml_edit = "0.22"
tracing = "0.1"
tracing-subscriber = "0.3"
vt100 = "0.15"

[profile.release]
lto = true
strip = true

[plugin]
name = "pr-review"
version = "0.1.0"
description = "click a GitHub PR link → open a reviewer in a right split"
capabilities = ["run-commands", "open-links"]

# click a PR URL to review it in a split. Swap `run` to your reviewer of
# choice — e.g. `tuicr ${url}`. `gh pr view` works out of the box with gh.
[[link]]
pattern = 'https://github\.com/[^/]+/[^/]+/pull/[0-9]+'
run = "gh pr view ${url}"
where = "right"

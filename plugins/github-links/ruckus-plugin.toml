[plugin]
name = "github-links"
version = "0.1.0"
description = "ctrl-click #123 or a commit SHA to open it on GitHub (repo-aware via gh)"
capabilities = ["run-commands", "open-links"]

# #123 -> open that issue/PR in the browser for the repo you're in
[[link]]
pattern = '#([0-9]+)'
run = "gh issue view ${1} --web"

# a 7-40 char hex blob -> open that commit on GitHub
[[link]]
pattern = '\b([0-9a-f]{7,40})\b'
run = "gh browse ${1}"
